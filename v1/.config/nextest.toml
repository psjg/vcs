# Time, bounded. A test of the backend, of `v1 lsp` or of Helix starts a real
# language server (rust-analyzer loads a cargo project; basedpyright starts
# node): each of those gets 60 s periods and is killed after three, 180 s.
# Everything else is killed after 30 s, nextest's usual bound here.
#
# Language servers load a project and take every core while they do. With
# all the tests at once, a diagnostics test timed out at 90 s and a rename
# test failed (2026-11-11, one run each); the same tests pass alone, and
# four copies of the server tests at once pass. So at most four of them
# run together.
#
# Run with: pkg env rust -- cargo nextest run
[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

[test-groups.language-servers]
max-threads = 4

[[profile.default.overrides]]
filter = "binary(backend) | binary(server) | binary(helix)"
slow-timeout = { period = "60s", terminate-after = 3 }
test-group = "language-servers"
