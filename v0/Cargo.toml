[package]
name = "v0"
version = "0.1.0"
edition = "2024"
description = "A version control spike: patch theory over a CRDT op log"
license = "AGPL-3.0-or-later"

[dependencies]
blake3 = "1"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.2.0", features = ["unicode"] }
spinning_top = "0.3.0"
talc = "5.1.1"
unicode-segmentation = "1.13.3"
# The structure layer (src/syntax.rs): grammars are per document type.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-md = "0.5"

[features]
# Profiling builds only: replace the TigerStyle budget with the system
# allocator, so Instruments / heap / leaks can see individual allocations.
system-alloc = []

[dev-dependencies]
proptest = "1"
